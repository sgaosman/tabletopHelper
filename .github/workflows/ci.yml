name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon

  integration:
    name: Backend integration tests (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew integrationTest --no-daemon

  frontend:
    name: Frontend lint, type check, build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker-smoke:
    name: Production containers start and report healthy
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs512-signing-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the production stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 600
      - name: Frontend serves the app (Caddy running as non-root)
        run: curl -sf http://localhost/ | grep -q '<div id="root">'
      - name: Backend health endpoint reports UP
        run: docker compose -f docker-compose.prod.yml exec -T backend curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'
      - name: Containers run as non-root users
        run: |
          test "$(docker compose -f docker-compose.prod.yml exec -T backend id -u)" != "0"
          test "$(docker compose -f docker-compose.prod.yml exec -T frontend id -u)" != "0"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
