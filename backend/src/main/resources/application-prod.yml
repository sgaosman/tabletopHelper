spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    baseline-on-migrate: false

# The reverse proxy's X-Forwarded-For gives the client's address, which the login rate limit counts by; Tomcat trusts
# it only from a private-network proxy
server:
  forward-headers-strategy: native

# API docs and Swagger UI are for development only (D154)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.tabletophelper: INFO

# A loader that fails stops startup here, instead of being logged and skipped as in development (D155)
content:
  fail-on-error: true
