spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tabletophelper
    username: tabletophelper
    password: tabletophelper
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

# Unexpected errors show their real message in dev only; elsewhere users get a generic one (D155)
server:
  error:
    include-message: always

app:
  jwt:
    # For local development only; every other environment sets JWT_SECRET (D156)
    secret: dev-only-jwt-secret-for-local-development-never-used-in-production
  auth:
    # Browsers only store a Secure cookie over HTTPS, and local development uses plain HTTP (D156)
    cookie-secure: false

logging:
  level:
    com.tabletophelper: DEBUG
    org.hibernate.SQL: DEBUG
