spring:
  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Spring Boot 4 moved server.error.* to spring.web.error.*
  web:
    error:
      include-binding-errors: always

server:
  port: 8080

app:
  jwt:
    # No default: JWT_SECRET must be set, and startup fails if it is shorter than 32 bytes. Only the
    # dev profile has a secret of its own (D156)
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 900000
  auth:
    # The refresh cookie is Secure everywhere except the dev profile, which runs on plain HTTP (D156)
    cookie-secure: true

# The frontend generates its API types from this spec, so its output must be stable: OpenAPI 3.0
# with nullable, keys in order and JSON responses (D171). The prod profile turns the docs off (D154)
springdoc:
  api-docs:
    version: openapi_3_0
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

# Only the health endpoint is exposed, without details; Caddy does not proxy /actuator (D154)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
