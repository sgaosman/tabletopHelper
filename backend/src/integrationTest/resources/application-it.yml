# Integration tier (D172). The datasource comes from the Testcontainers @ServiceConnection.
spring:
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: false

app:
  jwt:
    # Its own secret, because R3 removes the default from application.yml (D156)
    secret: integration-tests-only-secret-that-is-long-enough-for-hs512-signing-0123456789
  websocket:
    # WebSocketSessionLifetimeIT waits for a short-lived token's socket to close
    expiry-sweep-interval: 500ms
  auth:
    # Every test registers and logs in from 127.0.0.1, so the limits are out of reach; AuthRateLimitIT lowers them
    rate-limit:
      login-per-ip: 1000000
      login-per-username: 1000000
      register-per-ip: 1000000
