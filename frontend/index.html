<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before the first paint, so pages never flash the default (D173)
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      } catch (e) {}
    </script>
    <!-- Fonts for every theme; browsers only download the files the current theme uses -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400..700;1,400&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya+SC:wght@400;500;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>Tabletop Helper</title>
  </head>
  <body>
    <div id="root"></div>
    <script>globalThis.global = globalThis;</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
